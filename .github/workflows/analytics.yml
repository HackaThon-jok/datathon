name: Analytics migration checks
on:
  push:
    paths: ['analytics/**', 'tests/test_analytics*.py', 'requirements-analytics*.txt', 'data/**', '.github/workflows/analytics.yml']
  pull_request:
    paths: ['analytics/**', 'tests/test_analytics*.py', 'requirements-analytics*.txt', 'data/**', '.github/workflows/analytics.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-analytics.txt
      - run: python -m analytics.verify
